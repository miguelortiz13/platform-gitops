# OpenTelemetry Tracing configuration for Online Boutique microservices
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: "opentelemetry-collector.monitoring.svc:4317"
            - name: OTEL_SERVICE_NAME
              value: "frontend"
---
